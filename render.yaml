services:
  - type: web
    name: tree-chatbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9  # pin below 3.14: pydantic-core==2.23.4 has no prebuilt wheel for 3.14 and fails to compile in Render's build sandbox
      - key: DATABASE_URL
        sync: false  # Neon Postgres connection string (direct, not -pooler) — Render's own free Postgres is NOT used: it's hard-deleted 30+14 days after creation, unacceptable for permanent production data behind printed QR codes
      - key: LLM_API_KEY
        sync: false  # Groq API key — switched from Hugging Face after its free monthly inference credits ran out
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: BASE_URL
        sync: false  # set this to the service's own Render URL, e.g. https://tree-chatbot.onrender.com — used to build each tree's QR code link

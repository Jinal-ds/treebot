name: Keep Render instance awake

# Render's free web-service plan spins down after 15 minutes with no inbound
# HTTP traffic (cold start takes 30-90s on the next request). Pinging /healthz
# every 5 minutes keeps it well under that window. This repo is public, so
# GitHub Actions minutes for this are unlimited and free.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -fsS --max-time 90 https://tree-chatbot-jtht.onrender.com/healthz
